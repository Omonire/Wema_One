services:
  # ─── Frontend (React + Vite) ───────────────────────────────────────
  - type: web
    name: luma-frontend
    runtime: static
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: /api
    routes:
      - type: rewrite
        source: /api/*
        destination: https://luma-api.onrender.com/api/*

  # ─── Backend (Flask + Gunicorn) ───────────────────────────────────
  - type: web
    name: luma-api
    runtime: python
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /api/system/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: luma-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://luma-frontend.onrender.com,http://localhost:5173,http://localhost:5174
      - key: SEED_DATA
        value: "1"
      - key: AI_ENABLED
        value: "false"
      - key: AI_PROVIDER
        value: mock
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ALAT_SANDBOX
        value: "true"
      - key: ALAT_BASE_URL
        value: https://sandbox-api.wemabank.com/alat/authenticator
      - key: ALAT_CLIENT_ID
        sync: false
      - key: ALAT_CLIENT_SECRET
        sync: false
      - key: ALAT_CALLBACK_URL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false

databases:
  - name: luma-db
    databaseName: luma
    user: luma
